[project]
name = "withings-mcp"
version = "0.1.0"
description = "MCP server for Withings — pull body composition, activity, workouts, and sleep data into Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "withings", "claude", "fitness", "health", "sleep", "body-composition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[project.scripts]
withings-mcp = "withings_mcp.__main__:cli"

[project.urls]
Homepage = "https://github.com/IcaroBichir/mcp_withings"
Issues = "https://github.com/IcaroBichir/mcp_withings/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["withings_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
